
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hug CJ</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
        }
        header {
            background-color: #000;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }
        .container {
            text-align: center;
            padding: 50px 20px;
        }
        .container h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .reservation-form {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .reservation-form input,
        .reservation-form textarea,
        .reservation-form button {
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .reservation-form button {
            background-color: #000;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .reservation-form button:hover {
            background-color: #444;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            padding: 20px;
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to HugCJ.com</h1>
        <p>Reserve a date to hug CJ</p>
   </header>

    <div class="container">
        <h2>Reserve Your Date</h2>
        <form class="reservation-form" action="https://formspree.io/f/xyzzargr" method="POST">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://media1.tenor.com/m/OzO1t3Sv7KUAAAAd/i-know-what-you-are.gif">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="date" name="date" required>
            <textarea name="message" placeholder="Optional Message" rows="4"></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 HugCJ.com. All rights reserved.</p>
    </footer>
</body>
</html>
